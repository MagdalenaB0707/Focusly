<ion-tabs>
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" [routerLink]="['/tabs/home']">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="courses" [routerLink]="['/tabs/courses']">
      <ion-icon name="library-outline"></ion-icon>
      <ion-label>Courses</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="activities" [routerLink]="['/tabs/activities']">
      <ion-icon name="flash-outline"></ion-icon>
      <ion-label>Activities</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="study-sessions" [routerLink]="['/tabs/study-sessions']">
      <ion-icon name="time-outline"></ion-icon>
      <ion-label>Sessions</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="goals" [routerLink]="['/tabs/goals']">
      <ion-icon name="trophy-outline"></ion-icon>
      <ion-label>Goals</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
