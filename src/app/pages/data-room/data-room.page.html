<ion-header>
  <ion-toolbar class="act-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="act-title">Data Room</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="ion-padding">
  <div class="dr-container">
    
    <div class="controls-card">
      <div class="control-group">
        <label>Metric</label>
        <select [(ngModel)]="metric" (change)="onControlsChanged()">
          <option value="minutes">Minutes</option>
          <option value="sessions">Sessions</option>
        </select>
      </div>

      <div class="control-group">
        <label>Rows</label>
        <select [(ngModel)]="rowDim" (change)="onControlsChanged()">
          <option value="courses">Courses</option>
          <option value="activities">Activities</option>
        </select>
      </div>

      <div class="control-group">
        <label>Columns</label>
        <select [(ngModel)]="colDim" (change)="onControlsChanged()">
          <option value="months">Months</option>
          <option value="weeks">Weeks</option>
        </select>
      </div>

      <div class="control-group">
        <label>Year</label>
        <select [(ngModel)]="year" (change)="onControlsChanged()">
          <option *ngFor="let y of [2024, 2025, 2026, 2027]" [value]="y">{{ y }}</option>
        </select>
      </div>
    </div>

    <div *ngIf="loading" class="dr-status">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <div *ngIf="!loading && !errorMsg" class="table-container">
      <table class="pivot-table">
        <thead>
          <tr>
            <th class="sticky-col header-cell">{{ rowDim === 'courses' ? 'Course' : 'Activity' }}</th>
            <th *ngFor="let c of colLabels">{{ c }}</th>
            <th class="total-col header-cell">Total</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows; trackBy: trackByRowId">
            <td class="sticky-col row-label">{{ r.label }}</td>
            <td *ngFor="let v of r.values" class="val-cell" [class.is-zero]="v === 0">
              {{ formatCell(v) }}
            </td>
            <td class="total-col val-cell highlight">{{ formatCell(r.total) }}</td>
          </tr>
        </tbody>
        <tfoot>
          <tr class="footer-row">
            <td class="sticky-col">Grand Total</td>
            <td *ngFor="let t of colTotals" class="val-cell">{{ formatCell(t) }}</td>
            <td class="total-col val-cell">{{ formatCell(grandTotal) }}</td>
          </tr>
        </tfoot>
      </table>

      <div *ngIf="rows.length === 0" class="empty-state">
        <ion-icon name="analytics-outline"></ion-icon>
        <p>No data found for {{ year }}</p>
      </div>
    </div>

  </div>
</ion-content>
