<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
  <ion-toolbar>
    <ion-title>
      <div class="menu-header">
        <img src="assets/icon/logo.png" class="menu-logo" />
        <span>Focusly</span>
      </div>
    </ion-title>

    <ion-buttons slot="end">
      <ion-menu-toggle auto-hide="false">
        <ion-button fill="clear" class="menu-close-btn" aria-label="Close menu">
          <ion-icon name="close-outline"></ion-icon>
        </ion-button>
      </ion-menu-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>




    <ion-content class="ion-padding">
      <ion-list>
        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/home" routerLinkActive="active-link">
            <ion-label>Home</ion-label>
          </ion-item>

        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/study-sessions" routerLinkActive="active-link">
            <ion-label>Study Sessions</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/courses" routerLinkActive="active-link">
            <ion-label>Courses</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/activities" routerLinkActive="active-link">
            <ion-label>Activities</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/goals" routerLinkActive="active-link">
            <ion-label>Goals</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle auto-hide="true">
          <ion-item routerLink="/data-room" routerLinkActive="active-link">
            <ion-label>Data Room</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>

    <ion-footer class="menu-footer">
      <ion-item lines="none" class="user-email-item">
        <ion-label>
          <p class="user-email-label">Logged in as</p>
          <h3 class="user-email">{{ userEmail || '—' }}</h3>
        </ion-label>
      </ion-item>

      <ion-button expand="block" fill="outline" (click)="logout()">
        Logout
      </ion-button>
    </ion-footer>

  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
